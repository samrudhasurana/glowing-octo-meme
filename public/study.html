<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study - Med Flashcards</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🩺 Med Flashcards</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="import.html">Import</a>
    </nav>
  </header>

  <main>
    <a href="index.html">&larr; Back to dashboard</a>
    <h1 id="deck-title">Study</h1>

    <div id="error" class="error-banner hidden"></div>

    <div class="study-stage">
      <div class="progress-text" id="progress-text"></div>

      <div id="setup-area" class="panel hidden" style="max-width: 480px; margin: 20px auto; text-align: left;">
        <h2>Ready to study?</h2>
        <p id="setup-info" class="subtitle"></p>
        <label for="session-size">How many cards this session?</label>
        <input type="number" id="session-size" min="1" />
        <div class="row wrap" style="margin-top: 8px;">
          <button type="button" class="btn secondary" data-quick="10">10</button>
          <button type="button" class="btn secondary" data-quick="20">20</button>
          <button type="button" class="btn secondary" data-quick="50">50</button>
          <button type="button" class="btn secondary" data-quick="all">All</button>
        </div>
        <div class="row" style="margin-top: 16px;">
          <button class="btn" id="start-session-btn">Start studying</button>
        </div>
      </div>

      <div id="card-area" class="hidden">
        <div class="flip-card" id="flip-card">
          <div id="front-text"></div>
          <div id="back-area" class="hidden">
            <div class="back-text" id="back-text"></div>
            <span class="explanation" id="explanation-text"></span>
          </div>
        </div>
        <div class="rating-buttons hidden" id="rating-buttons">
          <button class="again" data-rating="again">Again</button>
          <button class="hard" data-rating="hard">Hard</button>
          <button class="good" data-rating="good">Good</button>
          <button class="easy" data-rating="easy">Easy</button>
        </div>
        <p class="subtitle" id="flip-hint">Click the card to reveal the answer</p>
      </div>

      <div id="done-area" class="empty-state hidden"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
