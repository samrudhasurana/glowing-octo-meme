<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study - Med Flashcards</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🩺 Med Flashcards</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="import.html">Import</a>
    </nav>
  </header>

  <main>
    <a href="index.html">&larr; Back to dashboard</a>
    <h1 id="deck-title">Study</h1>

    <div id="error" class="error-banner hidden"></div>

    <div class="study-stage">
      <div class="progress-text" id="progress-text"></div>

      <div id="card-area" class="hidden">
        <div class="flip-card" id="flip-card">
          <div id="front-text"></div>
          <div id="back-area" class="hidden">
            <div class="back-text" id="back-text"></div>
            <span class="explanation" id="explanation-text"></span>
          </div>
        </div>
        <div class="rating-buttons hidden" id="rating-buttons">
          <button class="again" data-rating="again">Again</button>
          <button class="hard" data-rating="hard">Hard</button>
          <button class="good" data-rating="good">Good</button>
          <button class="easy" data-rating="easy">Easy</button>
        </div>
        <p class="subtitle" id="flip-hint">Click the card to reveal the answer</p>
      </div>

      <div id="done-area" class="empty-state hidden"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
