<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import - Med Flashcards</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🩺 Med Flashcards</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="import.html">Import</a>
    </nav>
  </header>

  <main>
    <a href="index.html">&larr; Back to dashboard</a>
    <h1>Import flashcards</h1>
    <p class="subtitle">
      Bring in cards generated by Claude (or written by hand) as JSON. See
      <a href="/docs/AI_IMPORT_GUIDE.md" target="_blank">the AI import guide</a>
      for a ready-to-copy prompt to extract flashcards from a textbook.
    </p>

    <div id="error" class="error-banner hidden"></div>
    <div id="success" class="success-banner hidden"></div>

    <div class="panel">
      <label for="target-deck">Import into</label>
      <select id="target-deck"></select>

      <div id="new-deck-fields" class="hidden">
        <label for="new-deck-name">New deck name</label>
        <input type="text" id="new-deck-name" placeholder="e.g. Cardiology - Arrhythmias" />
        <label for="new-deck-description">New deck description (optional)</label>
        <input type="text" id="new-deck-description" />
      </div>

      <label for="json-input">Flashcards JSON</label>
      <textarea id="json-input" style="min-height: 260px; font-family: ui-monospace, monospace;"
        placeholder='[
  {
    "front": "What is the mechanism of action of penicillin?",
    "back": "Inhibits bacterial cell wall synthesis by binding penicillin-binding proteins",
    "explanation": "Beta-lactams block transpeptidase cross-linking of peptidoglycan.",
    "tags": ["pharmacology", "antibiotics"],
    "distractors": ["Inhibits protein synthesis at the 30S subunit", "Inhibits DNA gyrase", "Inhibits folic acid synthesis"]
  }
]'></textarea>

      <div class="row" style="margin-top: 16px;">
        <button class="btn" id="preview-btn">Preview</button>
        <button class="btn" id="import-btn" disabled>Import</button>
      </div>

      <div id="preview-area" class="hidden" style="margin-top: 16px;"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/import.js"></script>
</body>
</html>
